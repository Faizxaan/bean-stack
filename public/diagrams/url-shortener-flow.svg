<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 964 345" width="964" height="345" role="img" aria-label="Flowchart for a URL shortener: a user reaches an app server through a load balancer; the app server consults a short code cache and a URL database, and sends click events to a queue processed by an analytics worker.">
<!-- Opaque background: the SVG loads via <img>, so page CSS variables cannot reach it. #f8fafc keeps the #475569 connector lines at 7.24:1 in both themes (they were 2.47:1 on the dark page background). -->
<rect width="100%" height="100%" fill="#f8fafc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;fill:#0f172a}</style>
<line x1="138" y1="190" x2="208.5" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="349.5" y1="190" x2="411" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="527" y1="190" x2="581" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="527" y1="190" x2="597.5" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="527" y1="190" x2="577" y2="310" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="751" y1="310" x2="786" y2="310" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="42" y="167" width="96" height="46" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="90" y="195" text-anchor="middle">User</text>
<rect x="210.5" y="167" width="139" height="46" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="280" y="195" text-anchor="middle">Load Balancer</text>
<rect x="413" y="167" width="114" height="46" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="470" y="195" text-anchor="middle">App Server</text>
<path d="M 583 56 a 82 9 0 0 0 164 0 v 28 a 82 9 0 0 1 -164 0 z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<ellipse cx="665" cy="56" rx="82" ry="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="665" y="75" text-anchor="middle">Short Code Cache</text>
<path d="M 599.5 176 a 65.5 9 0 0 0 131 0 v 28 a 65.5 9 0 0 1 -131 0 z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<ellipse cx="665" cy="176" rx="65.5" ry="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="665" y="195" text-anchor="middle">URL Database</text>
<rect x="579" y="287" width="172" height="46" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="665" y="315" text-anchor="middle">Click Event Queue</text>
<rect x="788" y="287" width="164" height="46" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="870" y="315" text-anchor="middle">Analytics Worker</text>
</svg>
