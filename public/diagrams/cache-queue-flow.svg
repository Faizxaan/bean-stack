<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 937.5 285" width="937.5" height="285" role="img" aria-label="Flowchart: a client talks to an app server, which uses a cache and a message queue; a worker consumes the queue and writes to the database, which replicates to a read replica.">
<!-- Opaque background: the SVG loads via <img>, so page CSS variables cannot reach it. #f8fafc keeps the #475569 connector lines at 7.24:1 in both themes (they were 2.47:1 on the dark page background). -->
<rect width="100%" height="100%" fill="#f8fafc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;fill:#0f172a}</style>
<line x1="138" y1="190" x2="221" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="337" y1="190" x2="420" y2="70" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="337" y1="190" x2="398.5" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="539.5" y1="190" x2="615" y2="90" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="713" y1="90" x2="614" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="337" y1="190" x2="614" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="714" y1="250" x2="792.5" y2="250" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="42" y="167" width="96" height="46" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="90" y="195" text-anchor="middle">Client</text>
<rect x="223" y="167" width="114" height="46" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="280" y="195" text-anchor="middle">App Server</text>
<path d="M 422 56 a 48 9 0 0 0 96 0 v 28 a 48 9 0 0 1 -96 0 z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<ellipse cx="470" cy="56" rx="48" ry="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="470" y="75" text-anchor="middle">Cache</text>
<rect x="400.5" y="167" width="139" height="46" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="470" y="195" text-anchor="middle">Message Queue</text>
<rect x="617" y="67" width="96" height="46" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="665" y="95" text-anchor="middle">Worker</text>
<path d="M 616 236 a 49 9 0 0 0 98 0 v 28 a 49 9 0 0 1 -98 0 z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<ellipse cx="665" cy="236" rx="49" ry="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="665" y="255" text-anchor="middle">Database</text>
<path d="M 794.5 236 a 65.5 9 0 0 0 131 0 v 28 a 65.5 9 0 0 1 -131 0 z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<ellipse cx="860" cy="236" rx="65.5" ry="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="860" y="255" text-anchor="middle">Read Replica</text>
</svg>
